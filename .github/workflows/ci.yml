name: Minty Launcher - C# Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: minty-windows-ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: .NET tests and Windows Native AOT publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test minty-launcher.Tests/MintyLauncher.Tests.csproj --configuration Release

      - name: Generate application icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/installer/build_icon.py

      - name: Publish self-contained Windows Native AOT app
        run: dotnet publish minty-launcher/MintyLauncher.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/launcher

      - name: Verify native executable
        run: python scripts/verify_windows_exe.py artifacts/launcher/minty-launcher.exe
