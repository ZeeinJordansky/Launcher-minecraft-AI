name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minty Launcher (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Extract source archive
        run: python -m zipfile -e Minty-Launcher-source.zip build-source

      - name: Build
        working-directory: build-source/minty-launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MintyLauncher-windows-x64
          path: build-source/minty-launcher/target/x86_64-pc-windows-msvc/release/minty-launcher.exe
          if-no-files-found: error
