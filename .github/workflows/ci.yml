name: Minty Launcher - Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 tests and single-file build
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run tests
        working-directory: minty-launcher
        run: cargo test --all-targets --target x86_64-pc-windows-msvc
      - name: Build one-file executable
        working-directory: minty-launcher
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Verify PE architecture and embedded icon
        shell: bash
        run: python scripts/verify_windows_exe.py minty-launcher/target/x86_64-pc-windows-msvc/release/minty-launcher.exe
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: minty-launcher-windows-x64
          path: minty-launcher/target/x86_64-pc-windows-msvc/release/minty-launcher.exe
          if-no-files-found: error
