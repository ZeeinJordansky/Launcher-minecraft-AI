name: Minty Launcher - Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish minty-launcher.exe
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path("source-parts").glob("part-*.txt"))
          if len(parts) != 12:
              raise SystemExit(f"Expected 12 source parts, found {len(parts)}")
          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          Path("Minty-Launcher-source.tar.xz").write_bytes(base64.b64decode(encoded, validate=True))
          PY

      - name: Extract source archive
        run: tar -xf Minty-Launcher-source.tar.xz

      - name: Set up JDK 21 (build-time only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run tests before publishing
        working-directory: minty-launcher
        run: cargo test --all-targets --target x86_64-pc-windows-msvc

      - name: Build self-contained Windows executable
        working-directory: minty-launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage exactly one application file
        shell: bash
        run: |
          mkdir -p dist
          built="minty-launcher/target/x86_64-pc-windows-msvc/release/minty-launcher.exe"
          test -s "$built"
          cp "$built" dist/minty-launcher.exe
          test "$(wc -c < dist/minty-launcher.exe)" -gt 1048576
          sha256sum dist/minty-launcher.exe

      - name: Publish executable-only GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Minty Launcher v0.1.${{ github.run_number }}
          body: |
            Minty Launcher for Windows 10/11 x64.

            Download the minty-launcher.exe asset and run it with a double-click. No terminal commands or separately installed Java are required from the user; the launcher downloads a compatible Java Runtime on first game launch.
          generate_release_notes: true
          files: dist/minty-launcher.exe
          fail_on_unmatched_files: true
          make_latest: true
