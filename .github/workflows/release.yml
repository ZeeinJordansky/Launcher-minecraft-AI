name: Minty Launcher - Global Release

on:
  push:
    tags:
      - "v2.0.0-global"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: minty-launcher/engine/go.mod
          cache-dependency-path: minty-launcher/engine/go.mod

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Go engine tests
        working-directory: minty-launcher/engine
        run: go test ./...

      - name: Build Windows Go engine
        working-directory: minty-launcher/engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-s -w" -o dist/minty-engine.exe ./cmd/minty-engine

      - name: Install Pillow and generate application icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/installer/build_icon.py

      - name: Publish self-contained Windows launcher
        run: dotnet publish minty-launcher/MintyLauncher.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/launcher

      - name: Stage portable package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/launcher/* -DestinationPath dist/MintyLauncher-Portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }

      - name: Compile setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=2.0.0" "scripts/installer/MintySetup.iss"
          if (!(Test-Path "dist/MintyLauncher-Setup.exe")) { throw "Setup EXE was not generated." }

      - name: Verify release binaries
        shell: pwsh
        run: |
          python scripts/verify_windows_exe.py dist/launcher/minty-launcher.exe
          python scripts/verify_windows_exe.py dist/launcher/minty-engine.exe --console
          if ((Get-Item dist/MintyLauncher-Setup.exe).Length -lt 1000000) { throw "Setup is unexpectedly small." }
          Get-FileHash dist/launcher/minty-launcher.exe -Algorithm SHA256
          Get-FileHash dist/launcher/minty-engine.exe -Algorithm SHA256
          Get-FileHash dist/MintyLauncher-Setup.exe -Algorithm SHA256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-global
          name: Minty Launcher 2.0.0-global
          body: |
            Minty Launcher 2.0.0-global for Windows 10/11 x64.

            - Новый интерфейс WPF на C# с авторским Minty-оформлением, анимациями и кастомной аватаркой.
            - Go-движок для Mojang, Modrinth, настроек, загрузок и запуска Java Edition.
            - Поиск и сортировка проектов Modrinth, категории модов, модпаков, ресурспаков и шейдеров.
            - Исправлены переполнение карточек каталога и установка контента в изолированные профили.
            - Переносимый ZIP включает интерфейс и Go-движок; установщик включает оба файла.
            - Установка модпаков выполняется через страницу Modrinth. Загрузчики модов и вход Microsoft пока не поддерживаются.
            - EXE не подписан Authenticode.
          generate_release_notes: true
          files: |
            dist/MintyLauncher-Setup.exe
            dist/MintyLauncher-Portable.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
