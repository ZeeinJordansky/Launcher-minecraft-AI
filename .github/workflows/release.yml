name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows executable and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Extract source archive
        run: python -m zipfile -e Minty-Launcher-source.zip build-source

      - name: Build
        working-directory: build-source/minty-launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare release asset
        run: copy /Y build-source\minty-launcher\target\x86_64-pc-windows-msvc\release\minty-launcher.exe MintyLauncher.exe
        shell: cmd

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Minty Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: MintyLauncher.exe
