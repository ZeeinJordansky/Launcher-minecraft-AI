name: Minty Launcher - Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish installer
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Rust tests
        working-directory: minty-launcher
        run: cargo test --all-targets --target x86_64-pc-windows-msvc

      - name: Build x64 application
        working-directory: minty-launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify application PE
        shell: bash
        run: python scripts/verify_windows_exe.py minty-launcher/target/x86_64-pc-windows-msvc/release/minty-launcher.exe

      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item minty-launcher/target/x86_64-pc-windows-msvc/release/minty-launcher.exe dist/minty-launcher.exe

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate setup icon
        run: python scripts/installer/build_icon.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }

      - name: Compile setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=0.6.0" "scripts/installer/MintySetup.iss"
          if (!(Test-Path "dist/MintyLauncher-Setup.exe")) { throw "Setup EXE was not generated." }

      - name: Verify installer and application
        shell: pwsh
        run: |
          python scripts/verify_windows_exe.py dist/minty-launcher.exe
          if ((Get-Item dist/MintyLauncher-Setup.exe).Length -lt 1000000) { throw "Setup is unexpectedly small." }
          Get-FileHash dist/minty-launcher.exe -Algorithm SHA256
          Get-FileHash dist/MintyLauncher-Setup.exe -Algorithm SHA256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: Minty Launcher v0.6.0
          body: |
              Minty Launcher v0.6.0 for Windows 10/11 x64.

              Большой редизайн интерфейса в духе современных игровых лаунчеров:
              компактная системная панель с анимированными кнопками окна, обновлённая навигация,
              единая карточка профиля справа, скруглённые формы и согласованные состояния кнопок.
              Исправлена компоновка: рабочие разделы и панели настроек используют всю доступную ширину,
              а область профиля не смещается при переключении страниц и изменении размера окна.

              Улучшены hover-анимации, активные состояния вкладок, отступы и визуальная иерархия.
              Аватар теперь имеет круглую маску и круглую обводку без квадратной рамки.
              Сохранены возможности запуска Minecraft, сборок, установки версий и модов,
              Bedrock, Skin Studio, Microsoft/офлайн-профилей и настроек.

              В сборке также остаются улучшения v0.5.0: скрытый запуск Java, импорт/экспорт PNG-скинов,
              инструменты UV-редактора, каталог Modrinth и 10 языков навигации.

              Ограничения: Skin Studio сохраняет PNG локально; публикация скина через Microsoft/Mojang
              или Ely.by не подключена. AppContainer-песочница не реализована; не запускайте непроверенные моды.
              EXE не подписан Authenticode и может вызвать предупреждение SmartScreen.
          generate_release_notes: true
          files: |
            dist/MintyLauncher-Setup.exe
            dist/minty-launcher.exe
          fail_on_unmatched_files: true
          make_latest: true
