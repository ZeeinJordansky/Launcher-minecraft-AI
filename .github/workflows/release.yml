name: Minty Launcher - Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish installer
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Rust tests
        working-directory: minty-launcher
        run: cargo test --all-targets --target x86_64-pc-windows-msvc

      - name: Build x64 application
        working-directory: minty-launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify application PE
        shell: bash
        run: python scripts/verify_windows_exe.py minty-launcher/target/x86_64-pc-windows-msvc/release/minty-launcher.exe

      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item minty-launcher/target/x86_64-pc-windows-msvc/release/minty-launcher.exe dist/minty-launcher.exe

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate setup icon
        run: python scripts/installer/build_icon.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }

      - name: Compile setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=1.7.0" "scripts/installer/MintySetup.iss"
          if (!(Test-Path "dist/MintyLauncher-Setup.exe")) { throw "Setup EXE was not generated." }

      - name: Verify installer and application
        shell: pwsh
        run: |
          python scripts/verify_windows_exe.py dist/minty-launcher.exe
          if ((Get-Item dist/MintyLauncher-Setup.exe).Length -lt 1000000) { throw "Setup is unexpectedly small." }
          Get-FileHash dist/minty-launcher.exe -Algorithm SHA256
          Get-FileHash dist/MintyLauncher-Setup.exe -Algorithm SHA256

      - name: Create or move v1.7.0 tag to the tested commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.updateRef({ owner, repo, ref: "tags/v1.7.0", sha: context.sha, force: true });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({ owner, repo, ref: "refs/tags/v1.7.0", sha: context.sha });
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: Minty Launcher v1.7.0
          body: |
            Minty Launcher v1.7.0 for Windows 10/11 x64.

            Интерфейс в стиле официального Minecraft Launcher:
            - Левая боковая панель: профиль, ник и статус аккаунта, навигация, настройки.
            - Тёмный фон с пиксельной текстурой, угловатые панели и зелёная кнопка «ИГРАТЬ» внизу.
            - Вкладки раздела Minecraft в стиле официального лаунчера.
            - Исправлен пустой раздел «Настройки»; исправлено смещение иконок, профиля и модов вправо.
            - Каталог модов: картинка, название, автор, описание, число скачиваний
              и выбор конкретной версии мода для скачивания.
            EXE не подписан Authenticode.
          generate_release_notes: true
          files: |
            dist/MintyLauncher-Setup.exe
            dist/minty-launcher.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
