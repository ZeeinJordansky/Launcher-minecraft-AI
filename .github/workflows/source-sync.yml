name: Publish readable Minty source tree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minty-source-sync-main
  cancel-in-progress: false

jobs:
  publish-source:
    name: Extract and commit source files
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild source archive from committed transport parts
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path("source-parts").glob("part-*.txt"))
          if len(parts) != 12:
              raise SystemExit(f"Expected 12 source parts, found {len(parts)}")
          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          Path("Minty-Launcher-source.tar.xz").write_bytes(base64.b64decode(encoded, validate=True))
          PY

      - name: Extract source files
        run: tar -xf Minty-Launcher-source.tar.xz

      - name: Commit readable project tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minty-launcher
          if git diff --cached --quiet; then
            echo "Source tree already up to date."
            exit 0
          fi
          git commit -m "Add readable Minty Launcher source tree"
          git push origin HEAD:main
