name: Minty Launcher - Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish MintyLauncher.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run tests before release
        run: cargo test --all-targets --target x86_64-pc-windows-msvc
      - name: Build Windows x64 executable
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare release file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/minty-launcher.exe' 'dist/MintyLauncher.exe'
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Minty Launcher v0.1.${{ github.run_number }}
          body: |
            Minty Launcher for Windows 10/11 x64.

            Download `MintyLauncher.exe` below. The executable is built on a Windows runner after unit tests pass.
          generate_release_notes: true
          files: dist/MintyLauncher.exe
          fail_on_unmatched_files: true
          make_latest: true
