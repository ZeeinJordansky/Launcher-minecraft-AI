name: Minty Launcher - Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 build and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run tests
        run: cargo test --all-targets --target x86_64-pc-windows-msvc
      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MintyLauncher-windows-x64
          path: target/x86_64-pc-windows-msvc/release/minty-launcher.exe
          if-no-files-found: error
